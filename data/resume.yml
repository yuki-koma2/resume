          - { body: "出張してユーザーにインタビュー / 業務実態の把握" }
          - { body: "育成・(一部)評価。キャリアチェンジ組向けに新卒研修レベルでの育成施策" }
          - { body: "エンジニア採用、社内管理用ツール・運用改善" }
          - { body: "ロギング・モニタリングの構築、パフォーマンス計測とボトルネック分析" }
          - { body: "障害対応フロー整備、本番アクセス制御棚卸しと再整備" }
          - { body: "ドキュメンテーション（規約・設計思想・働き方）" }
          - { body: "【社内共通パッケージ PJ】複数アプリ（フロントエンド SPA 群と Cloud Functions）が横断利用する社内 TypeScript パッケージ群を設計・初期構築。DDD のレイヤをドメイン / スキーマ / リポジトリ / 共通基盤の 4 つの npm パッケージに分離し、依存方向を npm 依存関係として固定化。「ドメインからインフラを参照させない」原則をライブラリ境界で物理的に強制", tags: [architecture, ddd] }
          - { body: "【社内共通パッケージ PJ】TypeScript の型システムを徹底活用。`IdValueObject` 抽象によりエンティティ ID 取り違えバグをコンパイル時検出。`as const` + `typeof X[number]` パターンでマスタデータを型化（ラベルとコードを一元管理）。`type-fest` の `JsonValue` と Firestore の `FieldValue` を合成した独自ヘルパーで、永続化のキー漏れ・余剰をコンパイル時検出", tags: [typescript, type_design] }
          - { body: "【社内共通パッケージ PJ】Firestore 依存をドメインから隔離する設計を実現。`DatabaseTimestamp` 抽象、双方向 Mapper パターン、`withConverter` 連携を組み合わせ、ドメイン側を Firestore 非依存に保ったまま型安全な永続化を担保。テーブル仕様変更時も影響範囲を局所化", tags: [architecture, firestore] }
          - { body: "【社内共通パッケージ PJ】`tsup` で ESM/CJS デュアルパッケージをビルド。conditional exports により Vue / Node（Cloud Functions）/ Jest の 3 環境から型安全に利用可能。GitHub Packages の private registry で社内配布。CI matrix 並列化と TZ 固定で日付境界の業務ロジックをタイムゾーン非依存に検証。引き渡し後 1 年以上にわたりチームで運用継続", tags: [tooling, cicd, ops] }
          - { body: "【介護領域新規 SaaS】病院と介護施設をマッチングする新規 SaaS を 0→1 でアーキテクチャ設計・初期実装。Turborepo モノレポ上に Nuxt 3 SPA 2 本 + Firebase Functions v2 を構築。DDD + クリーンアーキテクチャを社内共通パッケージとして切り出し、3 アプリ間で型安全に再利用可能化", tags: [architecture, monorepo, ddd] }
          - { body: "【介護領域新規 SaaS】Firebase / Firestore × DDD の同居をリポジトリ層 4 層分離 + 独立パッケージ化で割り切り、ドメイン層を Firestore 都合で歪まない構造に。詳細層は interface / mapper / firebaseSchema / impl の 4 つ。Firestore のクエリ制約（OR 不可 / IN 10 件制限 / カーソル仕様）を Specification パターンで吸収し、双方向ページング対応のクエリビルダを 1 クラスに集約", tags: [architecture, firestore, ddd] }
          - { body: "【介護領域新規 SaaS】Firebase Authentication（ID/Pass）+ SMS OTP（Amazon Pinpoint）+ IP CIDR 許可リストの 3 層直交セキュリティ設計。Firebase の MFA を採用しなかった理由（マルチリージョン / メール認証への切替容易性）まで ADR として明文化。共有アカウント運用という業務制約も解に織り込み", tags: [security, auth, adr] }
          - { body: "【介護領域新規 SaaS】チーム育成も含めて主導。テスト・OOP・DDD 未経験のジュニアメンバー複数名を OJT で育成し、Specification パターンや DI を伴う型安全モックテストを自力で書ける水準まで引き上げ。「設計を新規メンバーの教科書として書く」方針で、コード・ディレクトリ・命名そのものが OOP/DDD 入門の足場となる構造に。ADR 運用（テンプレート / 規約整備）を社内文化として定着", tags: [mentoring, culture, adr] }
          - { body: "【介護領域新規 SaaS】マルチフロント構成の技術選定を意図的に分離（病院向け Vuetify / 施設向け Tailwind + Clean Architecture / DDD 寄り）。早すぎる抽象化を避けて共通化をドメイン層に限定する技術判断と、ジュニアエンジニア育成の学習ステップ設計（中間レベル → 本来到達レベルへ段階的に上げる）の両側面を兼ねた選定。Firestore セキュリティルールに role ベースと所属ベースの二層権限モデルを実装。「やらない」判断も ADR に残し、後続の議論コストを削減", tags: [architecture, security, mentoring, adr] }
          - { body: "【介護領域 SaaS 管理画面】介護領域 SaaS の運用管理画面（Back Office）を 0→1 で単独設計・初期実装。Next.js 13 + NestJS 10 + Firebase + PostgreSQL（Prisma）の 3 層構成（フロント / API サーバ / Cloud Functions）を構築。フロントエンドに Clean Architecture / DDD を本格適用。`I*Repository` 抽象 + Mapper パターン + Context-based DI で、将来のサーバー API 化を見越した永続層分離を先制的に整備", tags: [architecture, fullstack, ddd] }
          - { body: "【介護領域 SaaS 管理画面】Firestore Security Rules（数百行規模）を「バックエンドの代替」として徹底活用。`checkFK`（NoSQL の外部キー制約相当）、スキーマ + 不変フィールド検証、ドメイン値検証をすべてルールに集約し、フロントを信用しないゼロトラスト設計を実現。`DatabaseTimestamp` 値オブジェクトラッパーで Firestore Timestamp 取り扱いを安全化し、`undefined` 系の頻出ランタイムエラーを根本撲滅", tags: [security, firestore, ddd] }
          - { body: "【介護領域 SaaS 管理画面】「ジュニアでも追える Clean Architecture」を設計テーマに採用。InversifyJS のような重量 IoC を避け Context + new で軽量 DI。UseCase 層を切らず Service + Repository の 2 層に圧縮、Mapper / Repository の境界だけは強く守る最小構成。TODO / NOTE コメントを「次に学ぶべき概念」のロードマップとしてリポジトリに埋め込み、テスト・OOP・DDD 未経験のジュニア 1 名を次期テックリードまで育成。運用移管後も破綻なくメンテナンスが継続", tags: [mentoring, architecture, learning] }
        tech: [TypeScript, Vue, "Nuxt 3", Vuetify, "Next.js", React, NestJS, Prisma, PostgreSQL, Firebase, Firestore, "Cloud Functions", "Cloud Run", GCP, tsup, "GitHub Packages", Turborepo, "Amazon Pinpoint"]
        variants: [long]
    variants: [long, short]

