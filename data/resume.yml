# ───────────────────────────────────────────
# 強み・弱み（LAPRAS job_summary より要素抽出）
# ───────────────────────────────────────────

strengths:
  # 2026 年版（2026-04-30 更新）— 旧 LAPRAS 由来 5 項目を全面入れ替え
  # 4 つの AI エージェントによる辛口レビューと本人ヒアリングを統合した結果
  - id: s-phase-coverage
    label: 事業フェーズに応じた開発判断の切り替え
    body: |
      フェーズに応じて技術投資の粒度を切り替える。
      安定期：仕様互換性と負債解消、新規事業：PoC速度と検証コスト、グロース局面：計測・運用設計、という重み付けを使い分けてきた。
    variants: [long, short]

  - id: s-e2e-execution
    label: ヒアリングから本番リリース・改善戦略まで一人で通す E2E 実行力
    body: |
      事業仮説の検証から要件定義・設計・開発リード・リリース実作業・モニタリング・改善方針策定まで、一気通貫で担当。
      組織を巻き込みつつ全工程に自分で踏み込んできた。
      スコープが広いだけでなく、各レイヤーで適切な深さに踏み込める。
    variants: [long, short]

  - id: s-strategy-chain
    label: 経営目標とユーザー体験をロジックチェーンで接続する戦略策定力
    body: |
      売上目標 → 体験定義 → 阻害要因分析 → 成果優先順位 → 大方針 → 施策 → 技術設計を1人で連結。
      批判的自己評価としてプランB併記まで踏み込む戦略構築のスタイル。
      経営層への段階的承認フローまで設計し、意思決定サポートまで完遂してきた。
    variants: [long, short]

  - id: s-novelty-injection
    label: 新しい概念を組織の意思決定軸に持ち込む力
    body: |
      抽象的な技術トレンドを、組織が動ける具体まで落として浸透させる。
      単なる「学習が早い」ではなく、組織の評価軸そのものを書き換えるレベル。
      例：ハーネスエンジニアリング概念を約1ヶ月で研究レポート化。フロントエンド移行戦略の決定軸を「AI親和性」に書き換え、組織意思決定まで完遂。
    variants: [long]

  - id: s-decision-residue
    label: 「やらない」判断を組織知に変える設計力
    body: |
      技術選定で採用するものより、却下するものの理由を残す。
      後続の議論コスト低減を狙った組織文化として定着させてきた。
      早すぎる抽象化を避け、現時点で必要のない共通化は明示的に保留する。
      共通UIコンポーネント化、UseCase層追加、Next.js移行などの「やらない判断」をADRとして継続的に残してきた。
    variants: [long, short]

  - id: s-mentoring-design
    label: ジュニアでも追える設計を、技術選定段階から組み込む育成設計力
    body: |
      技術選定そのものを学習機会として設計し、ジュニアでも追える形に翻訳する。
      テスト・OOP・DDD未経験のジュニアを、Specificationパターン・型安全モックテスト・次期テックリードまで段階的に引き上げた。
      マルチフロント技術選定を意図的に分離し、中間レベル → 本来到達レベルと段階的に上がる学習ステップとして組み込んだ。
    variants: [long, short]

  - id: s-zero-trust
    label: ゼロトラスト前提でルール側に複雑性を寄せる設計判断力
    body: |
      フロント直アクセスを許可。代わりに、ドメインバリデーション・外部キー制約相当・スキーマ検証をルール側に集約する。
      バックエンドを薄く保ちつつフロント側は信用しない設計とし、ルールが設計書として読める粒度まで作り込む。
      特にRLS系のアーキテクチャで重要な判断軸として持っている。
    variants: [long]

  - id: s-solo-production
    label: ソロ本番運用に耐える設計を一発で組める力
    body: |
      設計判断とインフラ・セキュリティ・運用設計を同時に組み立てる。
      「動くもの」ではなく「運用できるもの」を最初から組み立てられる粒度感を持つ。
      複数の0→1 PoC（共通基盤 / 医療文書OCR / 転院依頼自動化）を、GCP のインフラ・セキュリティまで含めて単独で本番投入してきた。
      構成例: Cloud Run / Firebase / IAM・Secret Manager。
    variants: [long]

weaknesses:
  # 2026 年版（2026-04-30 更新）— 否定的ニュアンスを排除し、能動的な表現に統一
  - id: w-solo-bias
    label: ソロでの設計・実装完遂が続いてきたため、他者を動かしての規模化の場面は相対的に少なめ
    body: |
      ソロでの設計・実装完遂が続いてきたため、他者を動かして規模化する場面は相対的に少なめ。
      テックリードとしての推進経験はあるが、純粋なマネジメント職とは異なる立ち位置で進めてきた。
      一人で進める機会が多かったため、複数チームを動かしての規模化は相対的に経験が薄い。
      起業時に共同創業者を巻き込む立場としても重要な自覚ポイントとして取り組み中。
    variants: [long]

  - id: w-management-experience
    label: 経営者としての意思決定実績はこれから
    body: |
      プロダクトレベルでの戦略策定・経営層への提案実績は積んできた。
      一方で、資金・組織・撤退判断など経営者としての意思決定実績はこれから積む段階。
      2026年5月に共同創業3名と介護・医療領域で起業予定。ここから本格的に積み上げる領域。
    variants: [long]

  - id: w-large-scale-org
    label: 全社規模・複数事業横断の組織変革経験は現職規模では機会がなかった
    body: |
      小〜中規模チームやBiz / Dev / CSをまたぐ改善、採用・育成・開発文化づくりには実績がある。
      数百人規模の組織変革やマルチプロダクト横断の意思決定経験は、現職フェーズで機会がなかった。
      次のフェーズで取り組みたい領域。
    variants: [long]

  - id: w-narrative
    label: 構造的な発信・ナラティブ力は伸ばし中
    body: |
      社内ドキュメント・PRD・議事録での構造的な言語化は得意。
      一方で、社外に向けて自分の知見・仮説をストーリーとして届ける筋肉は意識的に取り組み始めたばかり。
      2026年4月からポッドキャスト「カイラジ」のディレクションを開始。
      対外発信の継続的な訓練の段階。
    variants: [long]

# ───────────────────────────────────────────
# 設計思想 / Design Philosophy
# PJ 横断で適用される設計原則。achievement の上位レイヤとして "なぜそう判断したか" を残す。
# ───────────────────────────────────────────

design_philosophy:
  - id: dp-yarananai
    label: 「やらない」判断を ADR に残す
    body: |
      共通 UI コンポーネント化、Next.js 移行、OpenAPI 化、UseCase 層の追加など、
      誘惑の多い改善案を「現時点では採用しない」として理由付きで保留にする。
      技術選定は採用するものの理由よりも、却下するものの理由を残す方が組織を育てる。
      後続の議論コストを下げ、判断の経緯を組織知として継承する。
    seen_in: [3sunny-techlead, 3sunny-chief]
    variants: [long]

  - id: dp-mentoring-tech-integration
    label: 育成と技術選定を統合する
    body: |
      教育に十分なコストを掛けられない現場では、技術選定そのものを学習機会として設計する。
      本来到達したいレベル（DDD / Clean Architecture）を最初から押し付けず、
      中間レベルから段階的に上げる学習ステップを技術選定に組み込み、ジュニアでも追える設計に。
      技術判断と育成判断を分離せず、同じ意思決定で両立させる。
    seen_in: [3sunny-techlead]
    variants: [long]

  - id: dp-code-as-textbook
    label: コードを教科書として書く（人にも AI にも）
    body: |
      Entity / IdValueObject / AbstractValueObject の 3 つの基底をそろえて
      クラス・抽象・継承の概念を実例で見せる。
      命名・ディレクトリ・テスト構造そのものが学習教材として機能する状態に作る。
      副次的に、AI（Claude Code / Cursor / Codex 等）にとってもハーネスエンジニアリングが効きやすい
      コードベースになり、人間と AI の双方にとって読みやすいリポジトリが実現する。
    seen_in: [3sunny-techlead, 3sunny-chief]
    variants: [long]

  - id: dp-zero-trust
    label: ゼロトラスト設計（ルールが設計書として読める粒度まで）
    body: |
      フロント直アクセス（Firestore SDK 直接利用、RDB の RLS 等）を許可する代わりに、
      ルール側でドメインバリデーション・外部キー制約相当・スキーマ検証を完結させる。
      バックエンドを薄く保ちつつ、フロントを信用しない設計。
      RLS 系のアーキテクチャでは特に重要で、ルールが設計書として読める粒度まで作り込む必要がある。
    seen_in: [3sunny-techlead]
    variants: [long]

  - id: dp-no-premature-abstraction
    label: 早すぎる抽象化を避ける
    body: |
      現時点で必要のない共通化は明示的に保留する。
      共有 UI コンポーネント、汎用 ORM、独自フレームワーク等は
      「2 つ目以降の事例が出てから抽象化する」を原則に、
      代わりに共有するのはドメイン層（用語と契約）だけに限定する。
      過剰な抽象化が将来の変更コストを増やすことを避ける。
    seen_in: [3sunny-techlead]
    variants: [long]
