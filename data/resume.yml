  - id: s-process-improvement
    label: 開発プロセス・体制を整える力
    body: 開発プロセス改善、CI/CD導入、リリースプロセス効率化など、開発体制の向上に継続的に取り組んできた。
    source: lapras_job_summary
    variants: [long, short]
  - id: s-pdm-engineer
    label: PdM × エンジニアの橋渡し
    body: 施策の仮説検証、ユーザーインタビュー、プロダクトの未来像と現在の課題からのリソース配分など、業務範囲が広い。
    source: lapras_job_summary
    variants: [long, short]
  - id: s-org-builder
    label: チーム立ち上げ・課題解決の地力
    body: チームが未熟なところから立ち上がる過程で発生する課題の解決経験が多く、チーム課題の構造化と再定義は得意分野。
    source: lapras_job_summary
    variants: [long]

weaknesses:
  - id: w-not-specialist
    label: スペシャリストではない
    body: 特定技術を深く探求するタイプではなく、その意思もない。
    source: lapras_job_summary
    variants: [long]
  - id: w-strategy-learning
    label: ビジョン・戦略は学習中
    body: プロジェクトのビジョンや戦略レイヤーは、まだ学んでいる途中。
    source: lapras_job_summary
    variants: [long]
  - id: w-cross-functional-scale
    label: 高い視座での組織横断の大規模実績は未達
    body: |
      エンジニアとビジネスサイドの関係をさらに潤滑にする高い視座での動きは、
      小〜中規模（問い合わせ改善・業務効率改善）では実績があるが、大規模実績はまだ。
    source: lapras_job_summary
    variants: [long]
