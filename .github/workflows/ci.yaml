name: ci

on:
  push:
    branches:
      - master
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run lint

  generate-drift:
    # 単一ソース化（data/resume.yml）の整合性チェック。
    # YAML を編集したのに `npm run generate` を忘れて生成物が古いまま PR が来たら fail する。
    # 設計: task_memory/20260428/resume_update/single_source_design.md §6.2
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run generate
      - name: Check no drift in generated docs
        run: git diff --exit-code docs/README_generated.md docs/README_summary.md

  lint-generated:
    # 生成物（README_generated.md / README_summary.md）の textlint 検査。
    # 既存 lint ジョブは docs/README.md（手書き版）のみが対象なので、
    # 生成テンプレ起因の違反をすり抜けないよう独立ジョブで検査する。
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run lint:generated

  guard-task-memory:
    # task_memory/ は機密情報を含むためコミット禁止（CLAUDE.md「task_memory の機密性ポリシー」参照）。
    # PR / push の差分に task_memory/ 配下が含まれていれば fail する。
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Reject task_memory/ changes
        # SHA / event_name は GitHub 側が hex 40 桁・列挙型で制御するためシェル展開しても安全。
        # security 警告が出るが本ケースでは過剰反応のため env 経由にしない。
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="${{ github.event.pull_request.base.sha }}"
            HEAD="${{ github.event.pull_request.head.sha }}"
          else
            BASE="${{ github.event.before }}"
            HEAD="${{ github.sha }}"
          fi
          # 初回 push（BASE が空 / all-zero）の場合は比較できないのでスキップ
          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ]; then
            echo "Skipping (no base commit to compare)."
            exit 0
          fi
          CHANGED=$(git diff --name-only "$BASE" "$HEAD" | grep '^task_memory/' || true)
          if [ -n "$CHANGED" ]; then
            echo "ERROR: task_memory/ 配下のファイルがコミットされています。" >&2
            echo "       CLAUDE.md「task_memory の機密性ポリシー」を参照してください。" >&2
            echo "" >&2
            echo "$CHANGED" | sed 's/^/  /' >&2
            exit 1
          fi
          echo "OK: task_memory/ 配下に変更はありません。"
