name: Resume Update Reminder
on:
  schedule:
    - cron: 0 0 1 */3 *
jobs:
  create_issue:
    name: Create remind issue
    runs-on: ubuntu-latest
    permissions:
      issues: write
      contents: read
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Get date
        id: date
        run: echo "date=$(date +'%Y-%m-%d')" >> "$GITHUB_OUTPUT"
      - name: Create issue
        uses: peter-evans/create-issue-from-file@v6.0.0
        with:
          title: Remind resume update - ${{ steps.date.outputs.date }}
          content-filepath: .github/ISSUE_TEMPLATE/resume-remind.md
          labels: |
            docs
            reminder-bot
          assignees: ${{ github.repository_owner }}
          token: ${{ secrets.GITHUB_TOKEN }}
